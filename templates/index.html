<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riri FTP Control Panel Ultra</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div class="aurora"></div>
<main class="layout compact">
  <section class="panel control glass">
    <h1>⚡ FTP Mission Control</h1>
    <p class="subtitle">کنترل کامل هاست، پوشه، فایل، حذف، آپلود، ریکانکت و لینک نهایی HTTPS</p>

    <div class="grid2">
      <div><label>هاست مقصد</label><select id="server"></select></div>
      <div><label>Base URL (http/https)</label><input id="baseHttps" placeholder="http://dl1.example.com" /></div>
    </div>

    <label>مسیر فعلی</label>
    <div class="path-row"><input id="currentPath" value="/downloads" /><button onclick="loadList()">نمایش</button><button onclick="goUp()">⬆️</button></div>

    <label>ساخت پوشه جدید</label>
    <div class="path-row"><input id="newFolderName" placeholder="folder-name" /><button onclick="createFolder()">ساخت</button></div>

    <div class="grid2">
      <div><label>انتخاب فایل‌ها</label><input id="fileInput" type="file" multiple /></div>
      <div><label>تعداد تلاش مجدد</label><input id="retries" type="number" value="2" min="1" max="5" /></div>
    </div>
    <label>دانلود با لینک</label>
    <div class="path-row"><input id="fileUrlInput" placeholder="https://example.com/file.zip" /><button onclick="uploadByUrl()">دانلود با لینک</button></div>

    <button class="primary" onclick="uploadFiles()">💾 ذخیره در فضای محلی</button>

    <div class="progress-wrap">
      <div class="progress-meta">
        <strong id="progressTitle">آماده برای عملیات</strong>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar"><div id="progressFill"></div></div>
      <div id="progressText" class="progress-text">در انتظار شروع...</div>
      <button id="cancelTaskBtn" class="cancel-btn" style="display:none;">لغو عملیات</button>
    </div>

    <pre id="log"></pre>
  </section>

  <section class="panel explorer glass">
    <div class="explorer-head"><h2>🗂️ فایل‌های محلی</h2><button onclick="loadLocalFiles()">↻ رفرش</button></div>
    <table><thead><tr><th>نام</th><th>سایز</th><th>عملیات</th></tr></thead><tbody id="localItems"></tbody></table>
  </section>

  <section class="panel explorer glass">
    <div class="explorer-head"><h2>📂 فایل‌ها و پوشه‌ها</h2><button onclick="loadList()">↻ رفرش</button></div>
    <table><thead><tr><th>نوع</th><th>نام</th><th>سایز</th><th>عملیات</th></tr></thead><tbody id="items"></tbody></table>
  </section>
</main>
<script type="application/json" id="server-data">{{ servers|tojson }}</script>
<script src="/static/app.js"></script>
</body>
</html>
